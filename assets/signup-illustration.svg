<svg xmlns="http://www.w3.org/2000/svg" width="600" height="500" viewBox="0 0 600 500">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F5FF" />
      <stop offset="100%" stop-color="#E1E9FF" />
    </linearGradient>
    <linearGradient id="brain-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0040C1" />
      <stop offset="100%" stop-color="#0A1A35" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#0A1A35" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="500" fill="url(#bg-gradient)" rx="10" ry="10" />
  
  <!-- Decorative Elements -->
  <circle cx="50" cy="50" r="20" fill="#0040C1" opacity="0.1" />
  <circle cx="550" cy="450" r="30" fill="#FF5722" opacity="0.1" />
  <circle cx="500" cy="100" r="15" fill="#FF5722" opacity="0.1" />
  <circle cx="100" cy="400" r="25" fill="#0040C1" opacity="0.1" />
  
  <!-- Brain Network Visualization -->
  <g transform="translate(300, 230)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="100" fill="url(#brain-gradient)" />
    
    <!-- Brain Neurons -->
    <g fill="#FFFFFF" class="neurons">
      <circle cx="-50" cy="-30" r="8" opacity="0.8" data-neuron="1" />
      <circle cx="20" cy="-70" r="6" opacity="0.7" data-neuron="2" />
      <circle cx="60" cy="-20" r="7" opacity="0.8" data-neuron="3" />
      <circle cx="40" cy="50" r="9" opacity="0.9" data-neuron="4" />
      <circle cx="-30" cy="60" r="5" opacity="0.6" data-neuron="5" />
      <circle cx="-70" cy="10" r="7" opacity="0.7" data-neuron="6" />
      <circle cx="0" cy="0" r="10" opacity="1" data-neuron="7" />
      <circle cx="-20" cy="-60" r="6" opacity="0.7" data-neuron="8" />
      <circle cx="70" cy="20" r="5" opacity="0.6" data-neuron="9" />
    </g>
    
    <!-- Neural Connections -->
    <g stroke="#FFFFFF" opacity="0.5" class="connections">
      <line x1="-50" y1="-30" x2="20" y2="-70" stroke-width="1" data-connection="1-2" />
      <line x1="20" y1="-70" x2="60" y2="-20" stroke-width="1" data-connection="2-3" />
      <line x1="60" y1="-20" x2="40" y2="50" stroke-width="1" data-connection="3-4" />
      <line x1="40" y1="50" x2="-30" y2="60" stroke-width="1" data-connection="4-5" />
      <line x1="-30" y1="60" x2="-70" y2="10" stroke-width="1" data-connection="5-6" />
      <line x1="-70" y1="10" x2="-50" y2="-30" stroke-width="1" data-connection="6-1" />
      <line x1="0" y1="0" x2="-50" y2="-30" stroke-width="1" data-connection="7-1" />
      <line x1="0" y1="0" x2="20" y2="-70" stroke-width="1" data-connection="7-2" />
      <line x1="0" y1="0" x2="60" y2="-20" stroke-width="1" data-connection="7-3" />
      <line x1="0" y1="0" x2="40" y2="50" stroke-width="1" data-connection="7-4" />
      <line x1="0" y1="0" x2="-30" y2="60" stroke-width="1" data-connection="7-5" />
      <line x1="0" y1="0" x2="-70" y2="10" stroke-width="1" data-connection="7-6" />
      <line x1="-20" y1="-60" x2="0" y2="0" stroke-width="1" data-connection="8-7" />
      <line x1="70" y1="20" x2="0" y2="0" stroke-width="1" data-connection="9-7" />
    </g>
  </g>
  
  <!-- Platform Elements -->
  <g transform="translate(300, 350)">
    <rect x="-200" y="0" width="400" height="20" rx="10" ry="10" fill="#0A1A35" opacity="0.8" />
    <rect x="-150" y="40" width="300" height="15" rx="7.5" ry="7.5" fill="#0A1A35" opacity="0.6" />
    <rect x="-100" y="70" width="200" height="10" rx="5" ry="5" fill="#0A1A35" opacity="0.4" />
  </g>
  
  <!-- Document Icons -->
  <g transform="translate(150, 100)">
    <rect x="-30" y="-40" width="60" height="80" rx="5" ry="5" fill="#FFFFFF" stroke="#0040C1" stroke-width="2" />
    <line x1="-15" y1="-20" x2="15" y2="-20" stroke="#0040C1" stroke-width="2" />
    <line x1="-15" y1="-5" x2="5" y2="-5" stroke="#0040C1" stroke-width="2" />
    <line x1="-15" y1="10" x2="10" y2="10" stroke="#0040C1" stroke-width="2" />
    <line x1="-15" y1="25" x2="15" y2="25" stroke="#0040C1" stroke-width="2" />
  </g>
  
  <g transform="translate(450, 150)">
    <rect x="-40" y="-50" width="80" height="100" rx="5" ry="5" fill="#FFFFFF" stroke="#FF5722" stroke-width="2" />
    <circle cx="0" cy="-25" r="15" fill="none" stroke="#FF5722" stroke-width="2" />
    <circle cx="-5" cy="-28" r="2" fill="#FF5722" />
    <circle cx="5" cy="-28" r="2" fill="#FF5722" />
    <path d="M-8,-18 Q0,-13 8,-18" fill="none" stroke="#FF5722" stroke-width="2" />
    <line x1="-20" y1="0" x2="20" y2="0" stroke="#FF5722" stroke-width="2" />
    <line x1="-20" y1="15" x2="10" y2="15" stroke="#FF5722" stroke-width="2" />
    <line x1="-20" y1="30" x2="15" y2="30" stroke="#FF5722" stroke-width="2" />
  </g>
  
  <!-- Lock/Security Icon -->
  <g transform="translate(200, 350)">
    <rect x="-25" y="-10" width="50" height="40" rx="5" ry="5" fill="#FFFFFF" stroke="#0040C1" stroke-width="2" />
    <path d="M-10,-10 V-30 A10,10 0 0,1 10,-30 V-10" fill="none" stroke="#0040C1" stroke-width="2" />
    <circle cx="0" cy="10" r="8" fill="#0040C1" />
    <line x1="0" y1="5" x2="0" y2="15" stroke="#FFFFFF" stroke-width="2" />
  </g>
  
  <!-- Check/Complete Icon -->
  <g transform="translate(400, 380)">
    <circle cx="0" cy="0" r="30" fill="#FFFFFF" stroke="#FF5722" stroke-width="2" />
    <path d="M-15,0 L-5,10 L15,-10" fill="none" stroke="#FF5722" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg> 