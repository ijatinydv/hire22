<svg xmlns="http://www.w3.org/2000/svg" width="600" height="500" viewBox="0 0 600 500">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F5FF" />
      <stop offset="100%" stop-color="#E1E9FF" />
    </linearGradient>
    <linearGradient id="panel-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0040C1" />
      <stop offset="100%" stop-color="#0A1A35" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#0A1A35" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="500" fill="url(#bg-gradient)" rx="10" ry="10" />
  
  <!-- Decorative Elements -->
  <circle cx="50" cy="50" r="20" fill="#0040C1" opacity="0.1" />
  <circle cx="550" cy="450" r="30" fill="#FF5722" opacity="0.1" />
  <circle cx="500" cy="100" r="15" fill="#FF5722" opacity="0.1" />
  <circle cx="100" cy="400" r="25" fill="#0040C1" opacity="0.1" />
  
  <!-- Device Frame -->
  <g transform="translate(300, 250)" filter="url(#shadow)">
    <rect x="-120" y="-170" width="240" height="340" rx="20" ry="20" fill="#FFFFFF" stroke="#DDD" stroke-width="2" />
    <rect x="-110" y="-160" width="220" height="300" rx="5" ry="5" fill="#F5F5F5" />
    <circle cx="0" cy="155" r="12" fill="#EEEEEE" stroke="#DDD" stroke-width="1" />
  </g>
  
  <!-- App Interface Elements -->
  <g transform="translate(300, 160)">
    <!-- Header -->
    <rect x="-110" y="-160" width="220" height="60" fill="url(#panel-gradient)" rx="5" ry="5" />
    <text x="0" y="-125" font-family="Arial" font-size="16" fill="white" text-anchor="middle">Hire22.ai</text>
    
    <!-- Navigation -->
    <rect x="-100" y="-90" width="200" height="40" fill="#FFFFFF" rx="5" ry="5" stroke="#DDD" stroke-width="1" />
    <circle cx="-80" cy="-70" r="5" fill="#0040C1" />
    <rect x="-70" y="-75" width="40" height="10" rx="2" ry="2" fill="#EEE" />
    <circle cx="-10" cy="-70" r="5" fill="#DDD" />
    <rect x="0" y="-75" width="40" height="10" rx="2" ry="2" fill="#EEE" />
    <circle cx="60" cy="-70" r="5" fill="#DDD" />
    <rect x="70" y="-75" width="20" height="10" rx="2" ry="2" fill="#EEE" />
    
    <!-- Form Elements -->
    <rect x="-90" y="-40" width="180" height="35" fill="#FFFFFF" rx="5" ry="5" stroke="#DDD" stroke-width="1" />
    <text x="-80" y="-18" font-family="Arial" font-size="10" fill="#666" text-anchor="start">Email</text>
    
    <rect x="-90" y="10" width="180" height="35" fill="#FFFFFF" rx="5" ry="5" stroke="#DDD" stroke-width="1" />
    <text x="-80" y="32" font-family="Arial" font-size="10" fill="#666" text-anchor="start">Password</text>
    <circle cx="75" cy="27" r="8" fill="#F5F5F5" stroke="#DDD" stroke-width="1" />
    <text x="75" y="31" font-family="Arial" font-size="12" fill="#666" text-anchor="middle">👁</text>
    
    <!-- Submit Button -->
    <rect x="-90" y="60" width="180" height="40" fill="#0040C1" rx="5" ry="5" />
    <text x="0" y="83" font-family="Arial" font-size="12" fill="white" text-anchor="middle" font-weight="bold">Login</text>
    
    <!-- Social Login -->
    <line x1="-70" y1="120" x2="70" y2="120" stroke="#DDD" stroke-width="1" />
    <text x="0" y="115" font-family="Arial" font-size="10" fill="#888" text-anchor="middle">or login with</text>
    
    <circle cx="-40" cy="145" r="15" fill="#FFFFFF" stroke="#DDD" stroke-width="1" />
    <text x="-40" y="149" font-family="Arial" font-size="10" fill="#DB4437" text-anchor="middle">G</text>
    
    <circle cx="0" cy="145" r="15" fill="#FFFFFF" stroke="#DDD" stroke-width="1" />
    <text x="0" y="149" font-family="Arial" font-size="10" fill="#1877F2" text-anchor="middle">f</text>
    
    <circle cx="40" cy="145" r="15" fill="#FFFFFF" stroke="#DDD" stroke-width="1" />
    <text x="40" y="149" font-family="Arial" font-size="10" fill="#0077B5" text-anchor="middle">in</text>
  </g>
  
  <!-- Lock Icon -->
  <g transform="translate(150, 100)">
    <circle cx="0" cy="0" r="40" fill="#FFFFFF" filter="url(#shadow)" />
    <path d="M-15,-5 C-15,-20 15,-20 15,-5 L15,15 C15,25 -15,25 -15,15 Z" fill="#0040C1" />
    <rect x="-20" y="-5" width="40" height="25" rx="2" ry="2" fill="#0040C1" />
    <circle cx="0" cy="5" r="5" fill="#FFFFFF" />
    <rect x="-2" y="5" width="4" height="10" fill="#FFFFFF" />
  </g>
  
  <!-- Secure Connection Visualization -->
  <g transform="translate(450, 120)">
    <circle cx="0" cy="0" r="40" fill="#FFFFFF" filter="url(#shadow)" />
    <path d="M-15,-15 L15,15 M-15,15 L15,-15" stroke="#FF5722" stroke-width="5" stroke-linecap="round" />
    <circle cx="0" cy="0" r="12" fill="#FF5722" />
    <path d="M-5,-5 L5,5 M-5,5 L5,-5" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
  </g>
  
  <!-- AI Assistant -->
  <g transform="translate(480, 350)">
    <circle cx="0" cy="0" r="50" fill="#FFFFFF" filter="url(#shadow)" />
    <circle cx="0" cy="-10" r="25" fill="#0040C1" opacity="0.8" />
    <circle cx="-10" cy="-15" r="5" fill="#FFFFFF" opacity="0.9" />
    <circle cx="10" cy="-15" r="5" fill="#FFFFFF" opacity="0.9" />
    <path d="M-10,0 Q0,10 10,0" stroke="#FFFFFF" stroke-width="2" fill="none" />
    <circle cx="-20" cy="-35" r="8" fill="#FF5722" opacity="0.7" />
    <circle cx="20" cy="-35" r="8" fill="#FF5722" opacity="0.7" />
    <circle cx="-30" cy="-15" r="6" fill="#FF5722" opacity="0.5" />
    <circle cx="30" cy="-15" r="6" fill="#FF5722" opacity="0.5" />
    <path d="M0,15 Q-30,40 -20,70" stroke="#0040C1" stroke-width="2" fill="none" />
    <path d="M0,15 Q30,40 20,70" stroke="#0040C1" stroke-width="2" fill="none" />
  </g>
  
  <!-- Data Protection Shield -->
  <g transform="translate(130, 350)">
    <path d="M0,-50 L-40,-30 L-40,20 Q-40,50 0,60 Q40,50 40,20 L40,-30 Z" fill="#FFFFFF" stroke="#0040C1" stroke-width="2" filter="url(#shadow)" />
    <path d="M0,-40 L-30,-25 L-30,15 Q-30,40 0,50 Q30,40 30,15 L30,-25 Z" fill="#F0F5FF" stroke="none" />
    <path d="M-15,10 L-5,20 L20,-5" stroke="#0040C1" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg> 