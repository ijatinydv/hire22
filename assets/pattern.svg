<svg width="500" height="500" viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid-pattern" x="0" y="0" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M0 0 L50 0" stroke="#FFFFFF" stroke-width="0.5" opacity="0.1"/>
      <path d="M0 10 L50 10" stroke="#FFFFFF" stroke-width="0.5" opacity="0.05"/>
      <path d="M0 20 L50 20" stroke="#FFFFFF" stroke-width="0.5" opacity="0.1"/>
      <path d="M0 30 L50 30" stroke="#FFFFFF" stroke-width="0.5" opacity="0.05"/>
      <path d="M0 40 L50 40" stroke="#FFFFFF" stroke-width="0.5" opacity="0.1"/>
      <path d="M0 0 L0 50" stroke="#FFFFFF" stroke-width="0.5" opacity="0.1"/>
      <path d="M10 0 L10 50" stroke="#FFFFFF" stroke-width="0.5" opacity="0.05"/>
      <path d="M20 0 L20 50" stroke="#FFFFFF" stroke-width="0.5" opacity="0.1"/>
      <path d="M30 0 L30 50" stroke="#FFFFFF" stroke-width="0.5" opacity="0.05"/>
      <path d="M40 0 L40 50" stroke="#FFFFFF" stroke-width="0.5" opacity="0.1"/>
      <circle cx="10" cy="10" r="1" fill="#FFFFFF" opacity="0.3"/>
      <circle cx="30" cy="10" r="1" fill="#FFFFFF" opacity="0.3"/>
      <circle cx="10" cy="30" r="1" fill="#FFFFFF" opacity="0.3"/>
      <circle cx="30" cy="30" r="1" fill="#FFFFFF" opacity="0.3"/>
    </pattern>
    
    <pattern id="circuit-pattern" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M20 20 L50 20 L50 50 L80 50" stroke="#FFFFFF" stroke-width="1" opacity="0.2"/>
      <path d="M20 80 L50 80 L50 50" stroke="#FFFFFF" stroke-width="1" opacity="0.2"/>
      <path d="M80 20 L80 80" stroke="#FFFFFF" stroke-width="1" opacity="0.2"/>
      <circle cx="20" cy="20" r="3" fill="#FFFFFF" opacity="0.3"/>
      <circle cx="50" cy="50" r="3" fill="#FFFFFF" opacity="0.3"/>
      <circle cx="80" cy="20" r="3" fill="#FFFFFF" opacity="0.3"/>
      <circle cx="20" cy="80" r="3" fill="#FFFFFF" opacity="0.3"/>
      <circle cx="80" cy="80" r="3" fill="#FFFFFF" opacity="0.3"/>
      <circle cx="80" cy="50" r="3" fill="#FFFFFF" opacity="0.3"/>
    </pattern>
  </defs>
  
  <rect width="500" height="500" fill="url(#grid-pattern)"/>
  <rect width="500" height="500" fill="url(#circuit-pattern)"/>
  
  <!-- Add diagonal lines -->
  <path d="M0 0 L500 500" stroke="#FFFFFF" stroke-width="1" opacity="0.05"/>
  <path d="M100 0 L500 400" stroke="#FFFFFF" stroke-width="1" opacity="0.05"/>
  <path d="M200 0 L500 300" stroke="#FFFFFF" stroke-width="1" opacity="0.05"/>
  <path d="M300 0 L500 200" stroke="#FFFFFF" stroke-width="1" opacity="0.05"/>
  <path d="M400 0 L500 100" stroke="#FFFFFF" stroke-width="1" opacity="0.05"/>
  
  <path d="M0 100 L400 500" stroke="#FFFFFF" stroke-width="1" opacity="0.05"/>
  <path d="M0 200 L300 500" stroke="#FFFFFF" stroke-width="1" opacity="0.05"/>
  <path d="M0 300 L200 500" stroke="#FFFFFF" stroke-width="1" opacity="0.05"/>
  <path d="M0 400 L100 500" stroke="#FFFFFF" stroke-width="1" opacity="0.05"/>
</svg> 